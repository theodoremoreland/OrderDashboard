name: Trigger Log Merged PR

on:
  pull_request:
    types: [closed]

jobs:
  call-shared:
    if: github.event.pull_request.merged == true
    uses: theodoremoreland/theodoremoreland/.github/workflows/log-merged-pull-request.yml@master
    with:
      api_endpoint: "${{ vars.API_ENDPOINT }}/pull-requests" # Point this to your /pull-requests endpoint variable
