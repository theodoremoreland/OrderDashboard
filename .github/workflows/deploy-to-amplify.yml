name: Trigger Deploy to Amplify

on:
  push:
    branches:
      - main

jobs:
  call-shared:
    uses: theodoremoreland/theodoremoreland/.github/workflows/deploy-to-amplify.yml@master
    permissions:
      id-token: write
      contents: read
    secrets:
      aws_role_arn: "${{ secrets.AWS_ROLE_ARN }}"
      aws_region: "${{ secrets.AWS_REGION }}"
      amplify_app_id: "${{ secrets.AMPLIFY_APP_ID }}"
